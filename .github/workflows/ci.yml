name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    # Each leg runs on its own architecture, not cross-compiled, so the tests run on
    # that CPU too, and libjpeg-turbo's cmake + nasm build sees its real target.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            artifact: ingot_apple_arm
          - name: macOS Intel
            os: macos-15-intel
            artifact: ingot_apple_x86_64

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup toolchain install

      - name: Install build tools
        run: brew install cmake nasm

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Upload app binary
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: target/release/ingot
