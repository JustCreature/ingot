[package]
name = "ingot_core"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
base64 = "0.23.1"
blake3 = { version = "1.8.5", features = ["mmap"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
crossbeam-channel = "0.5.15"
fast_image_resize = "6.0.0"
kamadak-exif = "0.6.1"
md-5 = "0.11.0"
rand = "0.10.3"
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "fs", "sync", "macros", "io-util", "time", "net"] }
turbojpeg = "1.4.0"
walkdir = "2.5.0"

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.27.0"
