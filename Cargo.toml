[package]
name = "ingot"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
eframe = { version = "0.37.0", features = ["persistence"] }
ingot_core = { path = "crates/ingot_core" }
ingot_develop = { version = "0.1.0", path = "crates/ingot_develop" }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
turbojpeg = "1.5.1"

[workspace]
resolver = "2"
members = ["crates/ingot_core", "crates/ingot_develop"]

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
tempfile = "3.27.0"
